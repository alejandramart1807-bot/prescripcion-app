<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Tinterno: guía clínica para el turno. Planes de prescripción, escalas, calculadoras y valores de referencia basados en guías colombianas e internacionales.">
<meta name="theme-color" content="#1E4B6E" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E151B" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tinterno">
<title>Tinterno · Guía clínica para el turno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Atkinson+Hyperlegible+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script>try{var t=JSON.parse(localStorage.getItem("tinterno-theme2")||'"auto"');if(t!=="auto")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<style>
:root{
  color-scheme:light;
  --bg:#F4F7F9; --surface:#FFFFFF; --surface-2:#F8FAFB; --text:#182630; --text-2:#61717F; --border:#DCE4EA;
  --brand:#1E4B6E; --accent:#2E67A0; --accent-soft:#E9F1F6;
  --amber:#9C5A1C; --amber-soft:#FFF4E7; --red:#B43B3B; --red-soft:#FCECEC; --green:#287553; --green-soft:#EAF5EF;
  --on-brand:#FFFFFF;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --r-card:14px; --r-ctl:10px; --r-sm:8px;
  --shadow:0 1px 2px rgba(24,38,48,.06),0 1px 1px rgba(24,38,48,.04);
  --shadow-up:0 8px 28px rgba(24,38,48,.18);
  --ctl:44px; --hdr:60px; --bnav:64px; --maxw:760px; --sbw:300px;
  --z-hdr:30; --z-nav:40; --z-sheet:60; --z-toast:80;
  --t:180ms; --ease:cubic-bezier(.2,.7,.2,1);
  --font:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Atkinson Hyperlegible Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0E151B; --surface:#151F27; --surface-2:#1B2730; --text:#EAF0F4; --text-2:#A6B4BE; --border:#2B3A45;
  --brand:#82B4E0; --accent:#82B4E0; --accent-soft:#1C2E3D; --amber:#E4A35F; --amber-soft:#2E2417;
  --red:#F08B86; --red-soft:#35201F; --green:#76C69F; --green-soft:#17302A; --on-brand:#0E151B;
  --shadow:none; --shadow-up:0 8px 28px rgba(0,0,0,.5);}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0E151B; --surface:#151F27; --surface-2:#1B2730; --text:#EAF0F4; --text-2:#A6B4BE; --border:#2B3A45;
  --brand:#82B4E0; --accent:#82B4E0; --accent-soft:#1C2E3D; --amber:#E4A35F; --amber-soft:#2E2417;
  --red:#F08B86; --red-soft:#35201F; --green:#76C69F; --green-soft:#17302A; --on-brand:#0E151B;
  --shadow:none; --shadow-up:0 8px 28px rgba(0,0,0,.5);}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.55}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:16px;height:16px}.ico.lg{width:24px;height:24px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;z-index:100;background:var(--surface);padding:8px 12px;border-radius:8px}
.skip:focus{left:8px}
/* ---------- header ---------- */
.hdr{position:sticky;top:0;z-index:var(--z-hdr);background:var(--surface);border-bottom:1px solid var(--border)}
.hdr-in{height:var(--hdr);display:flex;align-items:center;gap:var(--s2);padding:0 var(--s4)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);margin-right:auto;min-height:var(--ctl);border-radius:8px}
.logo svg{width:34px;height:34px;flex:none}
.logo b{display:block;font-size:1.08rem;letter-spacing:.2px;line-height:1.1}
.logo small{display:block;font-size:.78rem;color:var(--text-2);line-height:1.2}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:var(--ctl);height:var(--ctl);border:0;background:transparent;border-radius:var(--r-ctl);cursor:pointer;color:var(--text-2)}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn[aria-pressed="true"]{color:var(--amber)}
.pt-btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border:1px solid var(--border);background:var(--surface);border-radius:999px;cursor:pointer;font-size:.92rem;white-space:nowrap}
.pt-btn b{font-family:var(--mono);color:var(--brand)}
.pt-btn.noval{color:var(--text-2)}
.gsearch{position:relative;display:none;align-items:center;flex:1;max-width:520px;margin:0 var(--s4)}
.gsearch .ico{position:absolute;left:12px;color:var(--text-2)}
.gsearch input{width:100%;height:42px;border:1px solid var(--border);background:var(--surface-2);border-radius:var(--r-ctl);padding:0 76px 0 40px}
.gsearch input:focus{outline:2px solid var(--accent);outline-offset:0;background:var(--surface)}
.gsearch kbd{position:absolute;right:10px;font-family:var(--mono);font-size:.75rem;color:var(--text-2);border:1px solid var(--border);border-radius:5px;padding:1px 6px}
.gsearch .clr{position:absolute;right:36px}
.clr{display:none;width:32px;height:32px;border:0;background:transparent;border-radius:6px;cursor:pointer;color:var(--text-2);align-items:center;justify-content:center}
.clr.on{display:inline-flex}
/* ---------- layout ---------- */
.layout{display:block}
main{display:block;min-height:calc(100vh - var(--hdr));padding:var(--s4) var(--s4) calc(var(--bnav) + var(--s6));outline:none}
.page{max-width:var(--maxw);margin:0 auto}
.sb{display:none}
@media (min-width:1024px){
  .gsearch{display:flex}
  .layout{display:grid;grid-template-columns:var(--sbw) minmax(0,1fr)}
  body.sb-off .layout{grid-template-columns:0 minmax(0,1fr)}
  .sb{display:block;position:sticky;top:var(--hdr);height:calc(100vh - var(--hdr));overflow:auto;border-right:1px solid var(--border);background:var(--surface);padding:var(--s4) var(--s3) var(--s6)}
  body.sb-off .sb{visibility:hidden;padding:0;border:0}
  main{padding:var(--s5) var(--s6) var(--s7)}
  .bnav,.only-mob{display:none!important}
}
@media (max-width:1023px){.only-desk{display:none!important}}
/* ---------- sidebar ---------- */
.sb h2{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-2);margin:var(--s4) var(--s2) var(--s2);font-weight:700}
.sb h2:first-child{margin-top:0}
.nl{list-style:none;margin:0;padding:0}
.nl a,.nl button{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:6px 10px;border:0;background:transparent;text-align:left;text-decoration:none;color:var(--text);border-radius:var(--r-sm);cursor:pointer;font-size:.95rem;line-height:1.3}
.nl a:hover,.nl button:hover{background:var(--surface-2)}
.nl a[aria-current="page"]{background:var(--accent-soft);color:var(--brand);font-weight:700;box-shadow:inset 3px 0 0 var(--brand)}
.nl .cnt{margin-left:auto;font-size:.78rem;color:var(--text-2);font-family:var(--mono)}
.nl .chev{margin-left:6px;transition:transform var(--t) var(--ease);color:var(--text-2)}
.nl button[aria-expanded="true"] .chev{transform:rotate(90deg)}
.nl button[aria-expanded="true"]{font-weight:700}
.sub-nl{list-style:none;margin:2px 0 8px 12px;padding:0 0 0 8px;border-left:1px solid var(--border)}
.sub-nl .sh{font-size:.76rem;color:var(--text-2);margin:8px 10px 2px;font-weight:700}
.sub-nl a{font-size:.9rem;min-height:36px}
.sb-empty{font-size:.88rem;color:var(--text-2);margin:0 10px}
/* ---------- bottom nav ---------- */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:var(--z-nav);background:var(--surface);border-top:1px solid var(--border);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:4px}
.bnav button,.bnav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;border:0;background:transparent;color:var(--text-2);font-size:.72rem;border-radius:var(--r-ctl);cursor:pointer;text-decoration:none}
.bnav [aria-current="page"]{color:var(--brand);font-weight:700}
.bnav .primary{flex:2;flex-direction:row;gap:8px;background:var(--brand);color:var(--on-brand);font-size:.98rem;font-weight:700}
.bnav .fav-on{color:var(--amber)}
/* ---------- common ---------- */
.eyebrow{font-size:.8rem;color:var(--text-2);margin:0 0 var(--s2)}
.crumb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.85rem;color:var(--text-2);margin:0 0 var(--s2)}
.crumb a{color:var(--text-2);text-decoration:none}.crumb a:hover{color:var(--accent);text-decoration:underline}
h1{font-size:1.6rem;line-height:1.2;margin:0 0 var(--s2);letter-spacing:-.2px}
h2.sec{font-size:1.12rem;margin:0 0 var(--s3);display:flex;align-items:center;gap:8px}
.lead{color:var(--text-2);margin:0 0 var(--s4);max-width:68ch}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--shadow)}
.muted{color:var(--text-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--ctl);padding:0 16px;border-radius:var(--r-ctl);border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:700;text-decoration:none;color:var(--text)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.small{min-height:36px;padding:0 12px;font-size:.88rem}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;border-radius:6px;padding:2px 8px;background:var(--accent-soft);color:var(--brand)}
.badge.warn{background:var(--amber-soft);color:var(--amber)}
.badge.neutral{background:var(--surface-2);color:var(--text-2)}
/* ---------- home ---------- */
.hero h1{font-size:1.75rem;margin-bottom:var(--s4)}
.bigsearch{position:relative}
.bigsearch .ico{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--text-2)}
.bigsearch input{width:100%;height:56px;border:1px solid var(--border);background:var(--surface);border-radius:var(--r-card);padding:0 52px 0 48px;font-size:1.05rem;box-shadow:var(--shadow)}
.bigsearch input:focus{outline:2px solid var(--accent);outline-offset:0}
.bigsearch .clr{position:absolute;right:10px;top:50%;transform:translateY(-50%)}
.ctx{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s2);margin:var(--s4) 0 var(--s5)}
@media (min-width:640px){.ctx{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ctx a{display:flex;align-items:center;gap:10px;min-height:56px;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-ctl);text-decoration:none;color:var(--text);font-weight:700;font-size:.95rem}
.ctx a:hover{border-color:var(--accent)}
.ctx a .ico{color:var(--brand)}
.ctx a small{display:block;font-weight:400;color:var(--text-2);font-size:.78rem}
.hsec{margin:var(--s5) 0}
.hsec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 var(--s2)}
.hsec-h h2{font-size:1rem;margin:0}
.hsec-h a,.hsec-h button{font-size:.85rem;background:none;border:0;color:var(--accent);cursor:pointer;padding:6px}
.rows{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);overflow:hidden}
.rows li+li{border-top:1px solid var(--border)}
.rows a{display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 14px;text-decoration:none;color:var(--text)}
.rows a:hover{background:var(--surface-2)}
.rows .t{flex:1;min-width:0}
.rows .t b{display:block;font-weight:700;line-height:1.3}
.rows .t small{display:block;color:var(--text-2);font-size:.82rem;line-height:1.35;margin-top:2px}
.rows .chev{color:var(--text-2)}
.rows mark{background:var(--amber-soft);color:inherit;border-radius:3px;padding:0 1px}
.sysgrid{display:grid;grid-template-columns:1fr;gap:0}
@media (min-width:640px){.sysgrid.rows{display:grid;grid-template-columns:1fr 1fr}.sysgrid.rows li{border-top:1px solid var(--border)}.sysgrid.rows li:nth-child(-n+2){border-top:0}.sysgrid.rows li:nth-child(odd){border-right:1px solid var(--border)}}
.about{margin-top:var(--s6)}
.about summary{cursor:pointer;min-height:var(--ctl);display:flex;align-items:center;gap:8px;font-weight:700}
.about p{max-width:70ch;color:var(--text-2)}
.foot{font-size:.82rem;color:var(--text-2);max-width:70ch;margin:var(--s6) auto 0;text-align:center}
/* ---------- search view ---------- */
.rcount{font-size:.85rem;color:var(--text-2);margin:var(--s3) 0 var(--s2)}
.empty{padding:var(--s5) var(--s4);text-align:center;color:var(--text-2)}
.empty b{display:block;color:var(--text);margin-bottom:6px}
/* ---------- ficha ---------- */
.fhead{margin-bottom:var(--s3)}
.fmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:var(--s2) 0 0}
.factions{display:flex;gap:4px;margin-left:auto}
.evstrip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-ctl);font-size:.9rem;margin:var(--s3) 0}
.evstrip .ico{color:var(--brand)}
.evstrip span{flex:1;min-width:200px}
.evstrip button{background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;min-height:36px;padding:0 6px}
.secnav{position:sticky;top:var(--hdr);z-index:20;background:var(--bg);margin:0 calc(-1*var(--s4));padding:6px var(--s4);display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border)}
.secnav::-webkit-scrollbar{display:none}
.secnav a{flex:none;display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border-radius:999px;text-decoration:none;color:var(--text-2);font-size:.88rem;font-weight:700;white-space:nowrap}
.secnav a[aria-current="true"]{background:var(--brand);color:var(--on-brand)}
@media (min-width:1024px){.secnav{margin:0;padding:8px 0;border-radius:0}}
.fsec{scroll-margin-top:calc(var(--hdr) + 60px);margin:var(--s5) 0}
.summary{padding:var(--s4);border-left:4px solid var(--brand)}
.summary h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-2);margin:0 0 var(--s3)}
.summary dl{margin:0;display:grid;grid-template-columns:1fr;gap:10px}
.summary dt{font-size:.8rem;font-weight:700;color:var(--brand);text-transform:uppercase;letter-spacing:.04em}
.summary dd{margin:2px 0 0;max-width:68ch}
.summary .sd{font-family:var(--mono);font-size:.92rem}
@media (min-width:720px){.summary dl{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:var(--s5)}}
.wneed{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-ctl);background:var(--amber-soft);color:var(--amber);margin:var(--s3) 0;font-size:.94rem}
.wneed span{flex:1}
.wneed button{border:1px solid currentColor;background:transparent;color:inherit;border-radius:var(--r-sm);min-height:40px;padding:0 12px;font-weight:700;cursor:pointer;white-space:nowrap}
.wok{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--text-2);margin:0 0 var(--s3)}
.wok b{font-family:var(--mono);color:var(--brand)}
.wok button{background:none;border:0;color:var(--accent);cursor:pointer;min-height:36px}
/* flow */
.flow{list-style:none;margin:0;padding:0;counter-reset:st}
.flow li{position:relative;counter-increment:st;padding:0 0 var(--s4) 44px;min-height:44px}
.flow li::before{content:counter(st);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--brand);font-weight:700;font-family:var(--mono);display:flex;align-items:center;justify-content:center;font-size:.9rem;border:1px solid var(--brand)}
.flow li::after{content:"";position:absolute;left:14.5px;top:32px;bottom:2px;width:1px;background:var(--border)}
.flow li:last-child::after{display:none}
.flow b{display:block;line-height:1.3}
.flow span{color:var(--text-2);font-size:.94rem}
@media (min-width:1024px){
  .flow.h{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:var(--s3)}
  .flow.h li{padding:40px 0 0 0;min-height:0}
  .flow.h li::after{left:34px;right:-8px;top:15px;bottom:auto;width:auto;height:1px}
}
.criteria{margin:0;padding-left:1.2em;max-width:70ch}
.criteria li{margin:6px 0}
/* orders */
.oh{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.orders{list-style:none;margin:0;padding:0;counter-reset:ord}
.orders .ocat{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text-2);padding:var(--s4) 0 var(--s2);border-bottom:1px solid var(--border)}
.orders .ocat:first-child{padding-top:var(--s2)}
.ord{counter-increment:ord;display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:4px 10px;padding:var(--s4) 0;border-bottom:1px solid var(--border)}
.ord::before{content:counter(ord);font-family:var(--mono);font-weight:700;color:var(--text-2);padding-top:1px}
.ord .body{min-width:0}
.ord .drug{font-weight:700;font-size:1.02rem;line-height:1.35}
.ord .dose{font-family:var(--mono);font-size:.95rem;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:6px 10px;margin-top:6px;max-width:72ch;overflow-wrap:anywhere}
.ord .meta{font-size:.9rem;color:var(--text-2);margin-top:6px;max-width:72ch}
.ord .meta em{font-style:normal;font-weight:700;color:var(--text)}
.ord .calc{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-family:var(--mono);font-weight:700;font-size:.92rem;color:var(--brand);background:var(--accent-soft);border-radius:var(--r-sm);padding:4px 10px}
.ord .calc.warn{color:var(--red);background:var(--red-soft)}
.ord .calc.need{color:var(--amber);background:var(--amber-soft);font-family:var(--font);font-weight:700;border:0;cursor:pointer;min-height:36px}
.ord .alt{margin-top:8px;padding:2px 0 2px 10px;border-left:2px solid var(--amber);font-size:.92rem;max-width:72ch}
.ord .alt b{display:inline-block;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--amber);margin-right:6px}
.ord .cp{align-self:start}
.notif{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--amber)}
.twin{display:grid;grid-template-columns:1fr;gap:var(--s3)}
@media (min-width:720px){.twin{grid-template-columns:1fr 1fr}}
.box{border-radius:var(--r-card);padding:var(--s4);border-top:3px solid}
.box h3{display:flex;align-items:center;gap:8px;margin:0 0 var(--s2);font-size:1rem}
.box ul{margin:0;padding-left:1.1em}.box li{margin:4px 0}
.box.goals{background:var(--accent-soft);border-color:var(--brand)}.box.goals h3{color:var(--brand)}
.box.alerts{background:var(--red-soft);border-color:var(--red)}.box.alerts h3{color:var(--red)}
.rel{display:flex;flex-direction:column}
.evd summary{cursor:pointer;min-height:var(--ctl);display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.05rem;list-style:none}
.evd summary::-webkit-details-marker{display:none}
.evd summary .chev{transition:transform var(--t) var(--ease);color:var(--text-2)}
.evd[open] summary .chev{transform:rotate(90deg)}
.evd dl{margin:var(--s3) 0 0}
.evd dt{font-weight:700;margin-top:var(--s3);font-size:.9rem}
.evd dd{margin:4px 0 0;color:var(--text-2);max-width:70ch}
.st-ok{color:var(--green);font-weight:700}.st-old{color:var(--amber);font-weight:700}.st-none{color:var(--red);font-weight:700}
.factbar{display:flex;gap:8px;flex-wrap:wrap;margin:var(--s5) 0 0}
/* calc & ref */
.cf{display:grid;gap:0;margin:var(--s3) 0}

.cf-val{font-family:var(--mono);font-size:1.3rem;font-weight:700;color:var(--brand)}
.cf-val.warn{color:var(--amber)}.cf-val.bad{color:var(--red)}.cf-val.ok{color:var(--green)}

.rt-p{font-weight:700;min-width:140px}.rt-v{font-family:var(--mono);min-width:150px}.rt-n{color:var(--text-2);font-size:.92rem}

/* ---------- sheet & dialogs ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,14,20,.45);z-index:var(--z-sheet);opacity:0;transition:opacity var(--t) var(--ease)}

.bsheet{position:fixed;left:0;right:0;bottom:0;z-index:calc(var(--z-sheet) + 1);background:var(--surface);border-radius:18px 18px 0 0;max-height:88vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform 220ms var(--ease);box-shadow:var(--shadow-up)}
.bsheet.on{transform:translateY(0)}
.bsheet .grab{display:flex;justify-content:center;padding:8px 0 2px;cursor:grab;touch-action:none}
.bsheet .grab i{width:40px;height:5px;border-radius:3px;background:var(--border)}
.bs-h{display:flex;align-items:center;gap:8px;padding:4px var(--s4) var(--s2);touch-action:none}

.dlg{position:fixed;z-index:calc(var(--z-sheet) + 1);background:var(--surface);box-shadow:var(--shadow-up);left:0;right:0;bottom:0;border-radius:18px 18px 0 0;padding:var(--s4) var(--s4) calc(var(--s5) + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform 200ms var(--ease);max-height:88vh;overflow:auto}
.dlg.on{transform:translateY(0)}
@media (min-width:1024px){.dlg{left:auto;right:var(--s5);bottom:auto;top:calc(var(--hdr) + 8px);width:380px;border-radius:var(--r-card);transform:translateY(-8px);opacity:0;transition:opacity var(--t),transform var(--t)}.dlg.on{transform:none;opacity:1}}
.dlg h2{margin:0 0 var(--s3);font-size:1.1rem;display:flex;align-items:center;gap:8px}

.kgin input{flex:1;min-width:0;border:0;background:transparent;font-family:var(--mono);font-size:1.6rem;font-weight:700;color:var(--brand);height:52px;outline:none}
.kgin span{color:var(--text-2);font-weight:700}
.dlg p{font-size:.9rem;color:var(--text-2)}
.menu-list{list-style:none;margin:0;padding:0}
.menu-list button,.menu-list a{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:0 8px;border:0;background:transparent;border-radius:var(--r-sm);cursor:pointer;text-align:left;text-decoration:none;color:var(--text);font-size:1rem}
.menu-list button:hover,.menu-list a:hover{background:var(--surface-2)}
/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(var(--bnav) + 16px);z-index:var(--z-toast);display:flex;align-items:center;gap:8px;background:var(--text);color:var(--surface);font-weight:700;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow-up);transform:translate(-50%,12px);opacity:0;pointer-events:none;transition:opacity var(--t),transform var(--t);max-width:calc(100vw - 32px)}

.know{padding:var(--s4)}.know h2.sec{font-size:1rem;margin-bottom:0}

.nudge span{flex:1}.nudge button{border:1px solid currentColor;background:transparent;color:inherit;border-radius:var(--r-sm);min-height:40px;padding:0 12px;font-weight:700;cursor:pointer}
.qopts{display:grid;gap:8px;margin:var(--s4) 0}
.qopt{text-align:left;min-height:52px;padding:12px 14px;border:1px solid var(--border);border-radius:var(--r-ctl);background:var(--surface);cursor:pointer;line-height:1.4}

.qopt.right{border:2px solid var(--green);background:var(--green-soft)}.qopt.wrong{border:2px solid var(--red);background:var(--red-soft)}

.modes{display:grid;gap:8px}@media (min-width:640px){.modes{grid-template-columns:1fr 1fr}}
.modes button{text-align:left;padding:14px;border:1px solid var(--border);border-radius:var(--r-card);background:var(--surface);cursor:pointer;min-height:44px}
.modes button b{display:flex;align-items:center;gap:8px;margin-bottom:4px}.modes button span{color:var(--text-2);font-size:.9rem}
.modes button[aria-checked="true"]{border:2px solid var(--brand);background:var(--accent-soft)}
.dep{padding:12px 0;border-bottom:1px solid var(--border)}.dep:last-child{border-bottom:0}
.dep-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.depbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surface-2);margin-bottom:4px}
.depbar i{display:block}.depbar .si{background:var(--green)}.depbar .mas{background:var(--amber)}.depbar .no{background:var(--red)}
.linkbtn{background:none;border:0;color:var(--accent);cursor:pointer;text-decoration:underline;font:inherit;padding:0}
[hidden]{display:none!important}
.mswitch{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;margin:0 0 var(--s3)}
.mswitch button{display:flex;align-items:center;justify-content:center;gap:6px;min-height:40px;border:0;border-radius:9px;background:transparent;color:var(--text-2);font-weight:700;cursor:pointer;font-size:.92rem}
.mswitch button[aria-checked="true"]{background:var(--surface);color:var(--brand);box-shadow:var(--shadow);outline:1px solid var(--border)}
.sb .mswitch{margin:0 4px var(--s2)}.sb .mswitch button{font-size:.82rem;min-height:36px}
.modepill{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:700;border-radius:999px;padding:3px 10px;border:1px solid var(--border);background:var(--surface);color:var(--brand);cursor:pointer;min-height:28px}
.mswitch button span{white-space:nowrap}
@media (max-width:380px){.mswitch button{font-size:.84rem;gap:4px}}

<script>
/* calc types:

   h:     dose unit/h                     -> mL/h = d/conc
   kgh:   dose unit/kg/h (maxRate unit/h) -> mL/h = d*kg/conc
   kg:    bolus unit/kg (max)             -> dose
   table: rows [[maxKgExclusive, dose, label]]
*/
const DX = [
{ id:"bradi", group:"Arritmias", name:"Bradiarritmia sintomática", aka:"bradicardia bav bloqueo av bloqueo auriculoventricular marcapasos atropina", page:"",
  sub:"FC baja con signos de hipoperfusión atribuibles a la bradicardia.",
  base:["AHA ACLS"],
  flow:[["Evalúa","¿Hipotensión, alteración de conciencia, dolor isquémico, IC aguda o shock?"],["1.ª línea","Atropina"],["Sin respuesta","Marcapasos transcutáneo o infusión de dopamina / adrenalina"],["Definitivo","Marcapasos transvenoso y corregir causa"]],
  criteria:["Estable y asintomático: monitoreo, ECG de 12 derivaciones y buscar causa; no requiere fármacos.","Causas a descartar de entrada: hiperpotasemia, isquemia inferior, fármacos (betabloqueador, calcioantagonista, digoxina), hipotiroidismo, hipoxia, hipotermia."],
  orders:[
    {cat:"Medidas generales"},
    {d:"Monitoreo continuo, oxígeno si SatO₂ < 90 %, 2 accesos venosos", n:"ECG 12 derivaciones; ionograma con K⁺ y Mg²⁺, troponina, TSH, niveles de digoxina si aplica."},
    {cat:"Farmacológico"},
    {d:"Atropina", dose:"1 mg IV en bolo, repetir c/3–5 min · máx 3 mg", n:"Poco útil en BAV de alto grado con QRS ancho o en corazón trasplantado; no retrase el marcapasos."},
    {d:"Dopamina (si atropina falla)", dose:"5–20 mcg/kg/min IV", dil:"400 mg en 250 mL SSN = 1600 mcg/mL", calc:{t:"kgmin",lo:5,hi:20,conc:1600}},
    {d:"Adrenalina (alternativa)", dose:"2–10 mcg/min IV", dil:"4 mg en 250 mL SSN = 16 mcg/mL", calc:{t:"min",lo:2,hi:10,conc:16}},

    {d:"Interconsulta a cardiología para marcapasos transvenoso", n:"Si persiste BAV avanzado o no hay captura estable."}
  ],
  goals:["Resolución de la hipoperfusión (PAS > 90, estado mental normal)","Captura eléctrica y mecánica si hay marcapasos"],
  alerts:["Intoxicación por betabloqueador: glucagón 3–10 mg IV en 3–5 min","Calcioantagonista o hiperpotasemia: gluconato de calcio 10 % 10–30 mL IV lento","IAM inferior: evita nitratos si hay compromiso de VD"]
},
{ id:"taqui", group:"Arritmias", name:"Taquiarritmia con pulso", aka:"taquicardia tsv supraventricular tv ventricular complejo ancho estrecho adenosina", page:"",
  sub:"Taquicardia con FC habitualmente > 150 lpm; primero define estabilidad, luego QRS y regularidad.",

  flow:[["Evalúa","¿Inestable? → cardioversión sincronizada"],["Estable","QRS estrecho o ancho · regular o irregular"],["Estrecho regular","Vagales → adenosina → nodal"],["Ancho regular","Adenosina solo si monomórfica → amiodarona"]],
  criteria:["Inestabilidad: hipotensión, alteración de conciencia, dolor isquémico, IC aguda, shock.","QRS ancho ≥ 120 ms: asume TV hasta demostrar lo contrario.","FA irregular: ver fichas de fibrilación auricular."],

},
{ id:"fa-inest", group:"Fibrilación auricular", name:"FA con inestabilidad hemodinámica", aka:"fibrilacion auricular inestable cardioversion electrica flutter", page:"",

 calcForm:{inputs:[sl("u","BUN (mg/dL)",[["< 18,2 (0)",0],["18,2–22,3 (2)",2],["22,4–27,9 (3)",3],["28–69,9 (4)",4],["≥ 70 (6)",6]]),sexo,nm("hb","Hemoglobina","g/dL"),sl("p","PAS",[["≥ 110 (0)",0],["100–109 (1)",1],["90–99 (2)",2],["< 90 (3)",3]]),ck("fc","FC ≥ 100"),ck("me","Melena"),ck("si","Síncope",2),ck("he","Hepatopatía",2),ck("ic","Insuficiencia cardíaca",2)],
 compute:v=>{if(!cN(v.hb))return null;const hb=v.sexo?(v.hb>=12?0:v.hb>=10?1:6):(v.hb>=13?0:v.hb>=12?1:v.hb>=10?3:6);const s=v.u+hb+v.p+v.fc+v.me+v.si+v.he+v.ic;return {v:`${s}`,t:s<=1?"Bajo riesgo: manejo ambulatorio posible":"Hospitalizar y endoscopia",l:s<=1?"ok":s>=7?"bad":"warn"};}}}),
mk({id:"c-bisap",group:"Digestivo",name:"BISAP (pancreatitis)",aka:"bisap pancreatitis gravedad",sub:"En las primeras 24 h.",

mk({id:"c-crcl",group:"Riñón y electrolitos",name:"Depuración de creatinina (Cockcroft-Gault)",aka:"cockcroft gault depuracion creatinina clcr ajuste dosis",sub:"Para ajuste de dosis de fármacos.",
 calcForm:{inputs:[nm("e","Edad","años"),nm("peso","Peso","kg"),nm("cr","Creatinina","mg/dL"),sexo],
 compute:v=>{if(!cN(v.e,v.peso,v.cr))return null;let c=(140-v.e)*v.peso/(72*v.cr);if(v.sexo)c*=0.85;return {v:`${cF(c,0)} mL/min`,t:c<30?"< 30: ajuste importante, evita metformina y muchos ACOD":c<60?"30–59: ajustar dosis":"",l:c<30?"bad":c<60?"warn":"ok"};}}}),
mk({id:"c-ckdepi",group:"Riñón y electrolitos",name:"TFG CKD-EPI 2021",aka:"tfg ckd epi filtracion glomerular erc",sub:"Sin coeficiente de raza.",
 calcForm:{inputs:[nm("e","Edad","años"),nm("cr","Creatinina","mg/dL"),sexo],
 compute:v=>{if(!cN(v.e,v.cr))return null;const k=v.sexo?0.7:0.9,a=v.sexo?-0.241:-0.302;let g=142*Math.pow(Math.min(v.cr/k,1),a)*Math.pow(Math.max(v.cr/k,1),-1.2)*Math.pow(0.9938,v.e)*(v.sexo?1.012:1);
  const st=g>=90?"G1":g>=60?"G2":g>=45?"G3a":g>=30?"G3b":g>=15?"G4":"G5";return {v:`${cF(g,0)} mL/min/1,73 m² (${st})`,t:"",l:g<30?"bad":g<60?"warn":"ok"};}}}),
mk({id:"c-ag",group:"Riñón y electrolitos",name:"Brecha aniónica, corrección por albúmina y delta/delta",aka:"anion gap brecha anionica delta delta acidosis metabolica",sub:"Normal ≈ 12 ± 2 (sin potasio).",
 calcForm:{inputs:[nm("na","Sodio","mEq/L"),nm("cl","Cloro","mEq/L"),nm("h","HCO₃⁻","mEq/L"),nm("alb","Albúmina (opcional)","g/dL")],
 compute:v=>{if(!cN(v.na,v.cl,v.h))return null;const ag=v.na-v.cl-v.h;const agc=cN(v.alb)?ag+2.5*(4-v.alb):ag;const dd=(agc-12)/(24-v.h);
  let t=agc>14?"Brecha elevada":"Brecha normal (acidosis hiperclorémica si HCO₃⁻ bajo)";if(agc>14&&v.h<24)t+=dd<1?" · delta < 1: + acidosis de brecha normal":dd>2?" · delta > 2: + alcalosis metabólica":" · acidosis de brecha pura";
  return {v:`Brecha ${cF(ag)}${cN(v.alb)?` · corregida ${cF(agc)}`:""}`,t,l:agc>14?"warn":"ok"};}}}),
mk({id:"c-winter",group:"Riñón y electrolitos",name:"Fórmula de Winter (compensación respiratoria)",aka:"winter paco2 esperada acidosis metabolica compensacion",sub:"PaCO₂ esperada = 1,5 × HCO₃⁻ + 8 ± 2.",

mk({id:"c-osm",group:"Riñón y electrolitos",name:"Osmolalidad calculada y brecha osmolar",aka:"osmolalidad brecha osmolar metanol toxicos",sub:"2 × Na + glucosa/18 + BUN/2,8.",
 calcForm:{inputs:[nm("na","Sodio","mEq/L"),nm("g","Glucosa","mg/dL"),nm("b","BUN","mg/dL"),nm("om","Osmolalidad medida (opcional)","mOsm/kg")],
 compute:v=>{if(!cN(v.na,v.g,v.b))return null;const c=2*v.na+v.g/18+v.b/2.8;const gap=cN(v.om)?v.om-c:null;return {v:`${cF(c,0)} mOsm/kg${gap!==null?` · brecha ${cF(gap,0)}`:""}`,t:gap!==null&&gap>10?"Brecha > 10: alcoholes tóxicos (metanol, etilenglicol)":"",l:gap!==null&&gap>10?"bad":"ok"};}}}),
mk({id:"c-nacorr",group:"Riñón y electrolitos",name:"Sodio corregido por glucosa",aka:"sodio corregido hiperglucemia pseudohiponatremia",sub:"Factor 1,6 (clásico) y 2,4 (Hillier).",

mk({id:"c-agua",group:"Riñón y electrolitos",name:"Déficit de agua libre",aka:"deficit de agua libre hipernatremia",sub:"ACT × (Na/140 − 1).",

mk({id:"c-adrogue",group:"Riñón y electrolitos",name:"Cambio de sodio por litro (Adrogué-Madias)",aka:"adrogue madias sodio solucion salina hipertonica correccion",sub:"Cuánto cambia el Na sérico con 1 L de la solución elegida.",

mk({id:"c-fena",group:"Riñón y electrolitos",name:"Fracción excretada de sodio (FENa)",aka:"fena fraccion excretada sodio lra prerrenal",sub:"No interpretable con diuréticos (usa FEUrea).",

mk({id:"c-infusion",group:"Dosificación y líquidos",name:"Infusión: dosis → mL/h",aka:"calculadora infusion goteo mcg kg min ml hora dilucion",sub:"Para cualquier dilución de tu servicio.",

mk({id:"c-ganzoni",group:"Dosificación y líquidos",name:"Déficit de hierro (Ganzoni)",aka:"ganzoni deficit de hierro hierro intravenoso sacarosa",sub:"Peso × (Hb meta − Hb) × 2,4 + depósitos.",

function calcCore(c,kg,u){

  }

function lev(a,b,max){if(Math.abs(a.length-b.length)>max)return max+1;const m=a.length,n=b.length;let prev=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const cur=[i];let best=i;for(let j=1;j<=n;j++){cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));if(cur[j]<best)best=cur[j];}if(best>max)return max+1;prev=cur;}return prev[n];}

function buildIdx(){IDX=DX.map(d=>{const t=TAX[d.id];const nameN=norm(d.name);const hay=norm(d.name+" "+(d.aka||"")+" "+d.group+" "+sysOf(d)+" "+t.sub+" "+macName(t.mac)+" "+((d.orders||[]).map(o=>o.d||"").join(" "))+" "+((d.rows||[]).map(r=>r[0]).join(" ")));return {d,nameN,hay,words:[...new Set(hay.split(/[^a-z0-9ñ]+/).filter(w=>w.length>2))]};});}
function searchDX(q){if(!IDX)buildIdx();const toks=norm(q).split(/\s+/).filter(Boolean);const out=[];
  for(const it of IDX){let score=0,ok=true,fuzzy=false;
    for(const t of toks){const alt=SYN[t];let sc=0;
      if(it.nameN.includes(t)||(alt&&it.nameN.includes(alt)))sc=it.nameN.startsWith(t)?5:4;
      else if(it.hay.includes(t)||(alt&&it.hay.includes(alt)))sc=2;
      else if(t.length>=4){const mx=t.length>=8?2:1;if(it.words.some(w=>lev(w,t,mx)<=mx||(w.length>t.length&&lev(w.slice(0,t.length),t,1)<=1))){sc=1;fuzzy=true;}}
      if(!sc){ok=false;break;}score+=sc;}
    if(ok){const qn=norm(q).trim();if(it.d.id===qn||it.nameN===qn)score+=10;if(PRIO[qn]===it.d.id)score+=8;if(it.d.calcForm&&!/escala|score|puntaje|calcul|criterio/.test(qn))score-=0.5;
      if(sysOf(it.d)==="Pediatría"&&!/nin|neonat|pedia|lactant|recien|bebe|\brn\b/.test(qn))score-=1;
      out.push({s:score,d:it.d,f:fuzzy});}}
  return out.sort((a,b)=>(a.f-b.f)||(b.s-a.s)||(a.d.name.length-b.d.name.length)).slice(0,80);}

let openLayer=null,lastFocus=null;
function openLayerEl(el,focusSel){closeLayer(true);lastFocus=document.activeElement;openLayer=el;const sc=$("#scrim");sc.hidden=false;el.hidden=false;document.body.style.overflow="hidden";
  requestAnimationFrame(()=>{sc.classList.add("on");el.classList.add("on");const f=focusSel?el.querySelector(focusSel):el.querySelector("button,input,a");if(f)f.focus({preventScroll:true});});}
function closeLayer(instant){if(!openLayer)return;const el=openLayer;openLayer=null;const sc=$("#scrim");el.classList.remove("on");sc.classList.remove("on");el.style.transform="";document.body.style.overflow="";
  const done=()=>{el.hidden=true;sc.hidden=true;};instant?done():setTimeout(done,200);if(lastFocus&&lastFocus.focus)lastFocus.focus({preventScroll:true});}
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&openLayer){e.preventDefault();closeLayer();return;}
  if(e.key==="Tab"&&openLayer){const f=[...openLayer.querySelectorAll("button,input,a[href],select,[tabindex]:not([tabindex='-1'])")].filter(x=>!x.disabled&&x.offsetParent!==null);if(!f.length)return;const a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus();}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}}
  if(e.key==="/"&&!openLayer&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();const q=$("#q");if(q&&q.offsetParent){q.focus();}else goSearch();}
});
function enableSwipe(el){let y0=null,dy=0;const zone=el.querySelectorAll(".grab,.bs-h");zone.forEach(z=>{
  z.addEventListener("pointerdown",e=>{y0=e.clientY;dy=0;el.style.transition="none";z.setPointerCapture(e.pointerId);});
  z.addEventListener("pointermove",e=>{if(y0===null)return;dy=Math.max(0,e.clientY-y0);el.style.transform=`translateY(${dy}px)`;});
  const end=()=>{if(y0===null)return;el.style.transition="";y0=null;if(dy>90)closeLayer();else el.style.transform="";};
  z.addEventListener("pointerup",end);z.addEventListener("pointercancel",end);});}

  if(d.goals&&d.goals[0])sum.push(["Meta",d.goals[0],false]);if(d.alerts&&d.alerts[0])sum.push(["Alerta principal",d.alerts[0],false]);

     <div class="box goals"><h3>${ic("target")} Metas</h3><ul>${(d.goals||[]).map(x=>`<li>${hiS(x)}</li>`).join("")}</ul></div>
     <div class="box alerts"><h3>${ic("alert")} Alertas</h3><ul>${(d.alerts||[]).map(x=>`<li>${hiS(x)}</li>`).join("")}</ul></div></section>`;

   <nav class="secnav" aria-label="Secciones de la ficha">${secs.map(([id,t])=>`<a href="#${d.id}" data-go="${id}">${t}</a>`).join("")}</nav>
   <section class="fsec panel summary" id="sec-resumen" aria-labelledby="h-sum"><h2 id="h-sum">Resumen de la conducta · tomado de esta ficha</h2><dl>${sum.map(([k,v,m])=>`<div><dt>${k}</dt><dd class="${m?"sd":""}">${hiS(v)}</dd></div>`).join("")}</dl></section>
   <div id="wnote"></div>
   ${blocks}
   ${knowHTML(d)}
   ${relHTML(d)}
   <section class="fsec" id="sec-evidencia"><details class="evd panel" style="padding:4px 16px 16px"><summary>${ic("book")} Evidencia y referencias ${ic("right","sm chev")}</summary>${evidenceHTML(g)}</details></section>
   <div class="factbar"><button class="btn primary" id="copyAll2">${ic("copy","sm")} Copiar órdenes</button><button class="btn" id="print2">${ic("print","sm")} Imprimir</button><button class="btn" id="share2">${ic("share","sm")} Compartir</button></div>
   <p class="foot">Apoyo a la decisión clínica. Verifica dosis, diluciones de tu servicio, función renal, alergias, embarazo e interacciones.</p></article>`;
  bindHead(d);renderWeightNote(d);bindNeedKg();
  if($("#copyAll"))$("#copyAll").onclick=()=>copyOrders(d);$("#copyAll2").onclick=()=>copyOrders(d);$("#print2").onclick=doPrint;$("#share2").onclick=()=>shareLink(d);
  const ol=$("#main .orders");if(ol)ol.addEventListener("click",e=>{const b=e.target.closest("[data-cp]");if(b)copyOne(d,+b.dataset.cp);});
  bindStudy(d);
  $("#evGo").onclick=()=>{const s=$("#sec-evidencia");s.querySelector("details").open=true;s.scrollIntoView({behavior:"smooth"});};
  $$(".secnav a").forEach(a=>a.onclick=e=>{e.preventDefault();const t=document.getElementById(a.dataset.go);if(t){if(a.dataset.go==="sec-evidencia")t.querySelector("details").open=true;t.scrollIntoView({behavior:"smooth"});}});
  spy();}
let SPY=null;
function spy(){if(SPY)SPY.disconnect();if(!("IntersectionObserver" in window))return;const links=$$(".secnav a");
  SPY=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){links.forEach(a=>{const on=a.dataset.go===e.target.id;a.setAttribute("aria-current",on);if(on)a.scrollIntoView({block:"nearest",inline:"center"});});}});},{rootMargin:"-130px 0px -60% 0px"});
  links.forEach(a=>{const t=document.getElementById(a.dataset.go);if(t)SPY.observe(t);});}

    if(i.type==="date")return `<label class="cf-row" for="${id}"><span>${i.label}</span><input type="date" id="${id}" data-id="${i.id}"></label>`;
    return `<label class="cf-row" for="${id}"><span>${i.label}</span><span class="cf-in"><input type="number" inputmode="decimal" step="any" id="${id}" data-id="${i.id}" ${i.id==="peso"&&KG>0?`value="${KG}"`:""} placeholder="${i.ph||""}"><em>${i.unit||""}</em></span></label>`;}).join("");

   ${d.notes&&d.notes.length?`<ul class="criteria">${d.notes.map(n=>`<li>${n}</li>`).join("")}</ul>`:""}${relHTML(d)}<p class="foot">Las escalas apoyan, no reemplazan, el juicio clínico.</p></article>`;

  $$("#main [data-id]").forEach(e=>{e.addEventListener("input",upd);e.addEventListener("change",upd);});upd();}

   <div class="panel rt-wrap"><table class="rt"><thead><tr><th scope="col">Parámetro</th><th scope="col">Rango</th><th scope="col">Interpretación</th></tr></thead><tbody>
   ${d.rows.map(r=>`<tr><td class="rt-p">${r[0]}</td><td class="rt-v">${r[1]}</td><td class="rt-n">${r[2]||""}</td></tr>`).join("")}</tbody></table></div>

/* ================= APRENDIZAJE: modo Estudio, repaso espaciado, "¿Lo sabías?" ================= */
let MODE=LS.get("tinterno-mode","turno");
let LRN=LS.get("tinterno-learn",{});
const DAY=864e5, BOXES=[1,3,7,16,35];
const REVEALED=new Set(), TRY=new Set(), PLAN={};
const saveL=()=>LS.set("tinterno-learn",LRN);
const isCritical=d=>TAX[d.id].ctx.has("critico")||CRIT.includes(d.id);
const firstOrder=d=>(d.orders||[]).find(o=>!o.cat);
const quizable=d=>!!(d&&!d.calcForm&&!d.rows&&firstOrder(d)&&(d.goals||[]).length&&(d.alerts||[]).length);
function logView(d){if(!quizable(d))return;const now=Date.now();const r=LRN[d.id]||{n:0,first:now,box:0,due:now+DAY/2,know:{si:0,mas:0,no:0}};r.n++;r.last=now;LRN[d.id]=r;saveL();}
function setMode(m){MODE=m;LS.set("tinterno-mode",m);REVEALED.clear();TRY.clear();toast(m==="estudio"?"Modo Estudio activado":"Modo Búsqueda rápida activado");route();}
const dueList=()=>Object.entries(LRN).filter(([id,r])=>quizable(byId(id))&&r.due<=Date.now()).sort((a,b)=>a[1].due-b[1].due).map(([id])=>id);
const nextDue=()=>{const v=Object.entries(LRN).filter(([id])=>quizable(byId(id))).map(([,r])=>r.due);return v.length?Math.min(...v):null;};
function rate(id,k){const now=Date.now();const r=LRN[id];if(!r)return;r.know[k]=(r.know[k]||0)+1;r.lastKnow=k;
  if(k==="no"){r.box=0;r.due=now+DAY;}else if(k==="mas"){r.box=Math.min(r.box,1);r.due=Math.min(r.due,now+DAY);}saveL();}
/* ---------- panel "Piensa primero" y "¿Lo sabías?" dentro de la ficha ---------- */
function studyGate(d){return (MODE==="estudio"||TRY.has(d.id))&&!isCritical(d)&&!REVEALED.has(d.id)&&quizable(d);}
function thinkHTML(d){return `<section class="fsec panel think" id="sec-ordenes" aria-labelledby="h-th">
  <h2 class="sec" id="h-th">${ic("pulse")} Piensa primero: ¿qué ordenarías tú?</h2>
  <p class="muted">Escribe tu plan: fármaco, dosis y vía. Después lo comparas con la ficha. Lo que intentas producir antes de ver la respuesta se recuerda mucho más que lo que solo lees.</p>
  <label class="vh" for="myPlan">Tu plan</label><textarea id="myPlan" rows="4" placeholder="Ej.: fármaco, dosis, vía y frecuencia…">${esc(PLAN[d.id]||"")}</textarea>
  <div class="think-a"><button class="btn primary" id="reveal">${ic("check","sm")} Mostrar órdenes y comparar</button><button class="btn" id="urgent">${ic("alert","sm")} Es urgente, muéstrame ya</button></div>
  <p class="muted" style="font-size:.85rem">Tu plan no sale de este dispositivo. El modo Estudio no aplica en fichas de paciente crítico.</p></section>`;}
function planHTML(d){const p=PLAN[d.id];return p?`<div class="myplan"><b>Tu plan</b><p>${esc(p)}</p><small>Compáralo: ¿qué te faltó, qué sobró, la dosis y la vía coinciden?</small></div>`:"";}
function nudgeHTML(d){const r=LRN[d.id];if(MODE==="estudio"||isCritical(d)||!r||r.n<5||TRY.has(d.id)||!quizable(d))return "";
  return `<div class="nudge">${ic("info")}<span>Has abierto esta ficha <b>${r.n} veces</b>. ¿Intentas predecir las órdenes antes de verlas?</span><button type="button" id="tryIt">Intentar</button></div>`;}
function knowHTML(d){if(!quizable(d))return "";const r=LRN[d.id]||{};return `<section class="fsec panel know" aria-labelledby="h-kn"><h2 class="sec" id="h-kn">¿Lo sabías antes de abrir esta ficha?</h2>
  <div class="know-a" role="group" aria-label="Qué tanto lo sabías">${[["si","Sí"],["mas","Más o menos"],["no","No"]].map(([k,t])=>`<button class="btn small" data-know="${k}" aria-pressed="${r.lastKnow===k}">${t}</button>`).join("")}</div>
  <p class="muted" id="knowMsg" style="font-size:.88rem;margin:8px 0 0">Tu respuesta alimenta el repaso y tu mapa de dependencia. Solo se guarda en este dispositivo.</p></section>`;}
function bindStudy(d){const rv=$("#reveal");if(rv)rv.onclick=()=>{PLAN[d.id]=$("#myPlan").value.trim();REVEALED.add(d.id);renderFicha(d);const o=$("#sec-ordenes");if(o)o.scrollIntoView();};
  const ur=$("#urgent");if(ur)ur.onclick=()=>{REVEALED.add(d.id);renderFicha(d);const o=$("#sec-ordenes");if(o)o.scrollIntoView();};
  const tr=$("#tryIt");if(tr)tr.onclick=()=>{TRY.add(d.id);renderFicha(d);const o=$("#sec-ordenes");if(o)o.scrollIntoView();};
  $$("[data-know]").forEach(b=>b.onclick=()=>{rate(d.id,b.dataset.know);$$("[data-know]").forEach(x=>x.setAttribute("aria-pressed",x===b));
    $("#knowMsg").textContent={si:"Anotado. Esta ficha espaciará su repaso.",mas:"Anotado. Aparecerá en tu repaso de mañana.",no:"Anotado. Aparecerá en tu repaso de mañana para que la afiances."}[b.dataset.know];});}
/* ---------- repaso espaciado ---------- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function distract(d,kind){const own=kind==="order"?d.orders.filter(o=>!o.cat).map(o=>norm(o.d)):(kind==="goal"?d.goals:d.alerts).map(norm);
  const val=x=>kind==="order"?firstOrder(x).d:kind==="goal"?x.goals[0]:x.alerts[0];
  const pool=DX.filter(x=>x.id!==d.id&&quizable(x));const same=shuffle(pool.filter(x=>TAX[x.id].mac===TAX[d.id].mac)),other=shuffle(pool.filter(x=>TAX[x.id].mac!==TAX[d.id].mac));
  const out=[],seen=new Set(own);for(const x of same.concat(other)){const v=val(x);const n=norm(v);if(seen.has(n)||v.length>160)continue;seen.add(n);out.push(v);if(out.length===3)break;}return out;}
function makeQ(d,kind){const name=d.name;
  if(kind==="order"){const c=firstOrder(d).d;return {id:d.id,kind,prompt:`En «${name}», ¿cuál es la primera orden de la ficha?`,correct:c,options:shuffle([c,...distract(d,"order")])};}
  if(kind==="goal"){const c=d.goals[0];return {id:d.id,kind,prompt:`¿Cuál de estas metas aparece en la ficha «${name}»?`,correct:c,options:shuffle([c,...distract(d,"goal")])};}
  const c=d.alerts[0];return {id:d.id,kind,prompt:`¿Cuál de estas alertas aparece en la ficha «${name}»?`,correct:c,options:shuffle([c,...distract(d,"alert")])};}
let QZ=null;
function startQuiz(ids){const kinds=["order","goal","alert"];const qs=ids.slice(0,3).map((id,i)=>makeQ(byId(id),kinds[(i+Math.floor(Math.random()*3))%3])).filter(q=>q.options.length>=3);
  QZ={qs,i:0,ok:0,answered:false};renderQuiz();}
function renderQuiz(){const m=$("#main");if(!QZ||!QZ.qs.length){m.innerHTML=`<div class="page"><h1>Repaso</h1><div class="empty"><b>No hay nada para repasar</b>Consulta fichas durante el turno y aquí aparecerán preguntas sobre ellas.</div></div>`;return;}
  if(QZ.i>=QZ.qs.length){m.innerHTML=`<div class="page"><h1>Repaso terminado</h1><div class="panel" style="padding:24px"><p style="font-size:1.4rem;margin:0 0 8px"><b>${QZ.ok} de ${QZ.qs.length}</b> correctas</p>
     <p class="muted">Las que fallaste vuelven mañana; las que acertaste se espacian cada vez más (1, 3, 7, 16 y 35 días).</p>
     <div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn primary" href="#aprendizaje">Ver mi mapa</a><a class="btn" href="#">Inicio</a>${dueList().length?`<button class="btn" id="again">Otras 3 preguntas</button>`:""}</div></div></div>`;
    const a=$("#again");if(a)a.onclick=()=>startQuiz(dueList());return;}
  const q=QZ.qs[QZ.i];
  m.innerHTML=`<div class="page"><nav class="crumb" aria-label="Ruta"><a href="#aprendizaje">Mi aprendizaje</a>${ic("right","sm")}<span>Repaso</span></nav>
   <p class="eyebrow">Pregunta ${QZ.i+1} de ${QZ.qs.length}</p><h1 style="font-size:1.3rem">${esc(q.prompt)}</h1>
   <div class="qopts" role="group" aria-label="Opciones">${q.options.map((o,k)=>`<button class="qopt" data-k="${k}">${esc(o)}</button>`).join("")}</div>
   <div id="qfb" aria-live="polite"></div></div>`;
  $$(".qopt").forEach(b=>b.onclick=()=>answer(+b.dataset.k));}
function answer(k){if(QZ.answered)return;QZ.answered=true;const q=QZ.qs[QZ.i],ok=q.options[k]===q.correct,now=Date.now(),r=LRN[q.id];
  if(r){if(ok){r.box=Math.min((r.box||0)+1,BOXES.length-1);r.due=now+BOXES[r.box]*DAY;}else{r.box=0;r.due=now+DAY;}r.lastQuiz=now;saveL();}
  if(ok)QZ.ok++;
  $$(".qopt").forEach((b,i)=>{b.disabled=true;if(q.options[i]===q.correct)b.classList.add("right");else if(i===k)b.classList.add("wrong");});
  $("#qfb").innerHTML=`<div class="qfb ${ok?"ok":"no"}">${ic(ok?"check":"alert")}<span>${ok?"Correcto.":"No era esa."} La respuesta de la ficha es: <b>${esc(q.correct)}</b></span></div>
   <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn primary" id="qnext">${QZ.i+1<QZ.qs.length?"Siguiente":"Ver resultado"}</button><a class="btn" href="#${q.id}">Abrir la ficha</a></div>`;
  $("#qnext").onclick=()=>{QZ.i++;QZ.answered=false;renderQuiz();};$("#qnext").focus();}
function renderRepaso(){const due=dueList();if(due.length){startQuiz(due);return;}
  const rec=Object.keys(LRN).filter(id=>quizable(byId(id)));const nd=nextDue();
  $("#main").innerHTML=`<div class="page"><h1>Repaso</h1><div class="empty"><b>Nada pendiente por hoy</b>${nd?`Próximo repaso: ${new Date(nd).toLocaleDateString("es-CO",{weekday:"long",day:"numeric",month:"long"})}.`:"Consulta fichas y aquí aparecerán preguntas sobre ellas."}
   ${rec.length?`<p style="margin-top:12px"><button class="btn" id="practice">Practicar igual con tus fichas</button></p>`:""}</div></div>`;
  const p=$("#practice");if(p)p.onclick=()=>startQuiz(shuffle(rec));}
/* ---------- mi aprendizaje: modo + mapa de dependencia ---------- */
function renderLearn(){const ent=Object.entries(LRN).filter(([id])=>quizable(byId(id)));const due=dueList().length;
  const bym={};ent.forEach(([id,r])=>{const m=TAX[id].mac;const o=bym[m]=bym[m]||{n:0,si:0,mas:0,no:0,f:0};o.f++;o.n+=r.n;o.si+=r.know.si||0;o.mas+=r.know.mas||0;o.no+=r.know.no||0;});
  const top=ent.sort((a,b)=>b[1].n-a[1].n).slice(0,6).map(([id])=>byId(id));
  const weak=Object.entries(LRN).filter(([id,r])=>quizable(byId(id))&&(r.lastKnow==="no"||r.lastKnow==="mas")).map(([id])=>byId(id));
  $("#main").innerHTML=`<div class="page"><h1>Mi aprendizaje</h1><p class="lead">Tinterno te ayuda en el turno, pero la meta es que cada vez la necesites menos.</p>
   <section class="hsec"><div class="hsec-h"><h2>Modo de uso</h2></div><div class="modes" role="radiogroup" aria-label="Modo de uso">
     <button role="radio" aria-checked="${MODE!=="estudio"}" data-mode="turno"><b>${ic("zap")} Búsqueda rápida</b><span>Para el turno: las órdenes aparecen primero, sin preguntas. Buscas, calculas y copias.</span></button>
     <button role="radio" aria-checked="${MODE==="estudio"}" data-mode="estudio"><b>${ic("book")} Estudio</b><span>Para aprender: ves el flujo, piensas tu plan antes de ver las órdenes y lo comparas. No aplica en fichas de paciente crítico.</span></button></div></section>
   <section class="hsec"><div class="hsec-h"><h2>Repaso espaciado</h2></div><ul class="rows"><li><a href="#repaso">${ic("clock")}<span class="t"><b>${due?`${due} ficha${due>1?"s":""} para repasar hoy`:"Nada pendiente por hoy"}</b><small>3 preguntas sobre lo que consultaste · se repiten a 1, 3, 7, 16 y 35 días</small></span>${ic("right","sm")}</a></li></ul></section>
   <section class="hsec"><div class="hsec-h"><h2>Mapa de dependencia</h2></div>
   ${ent.length?`<div class="panel" style="padding:8px 16px">${MAC.filter(m=>bym[m.k]).map(m=>{const o=bym[m.k],t=o.si+o.mas+o.no;const pc=x=>t?Math.round(100*x/t):0;
      return `<div class="dep"><div class="dep-h"><b>${m.n}</b><span class="muted">${o.f} ficha${o.f>1?"s":""} · ${o.n} consulta${o.n>1?"s":""}</span></div>
      ${t?`<div class="depbar" role="img" aria-label="Lo sabía ${pc(o.si)}%, más o menos ${pc(o.mas)}%, no ${pc(o.no)}%"><i class="si" style="width:${pc(o.si)}%"></i><i class="mas" style="width:${pc(o.mas)}%"></i><i class="no" style="width:${pc(o.no)}%"></i></div>
      <small class="muted">Lo sabía ${pc(o.si)} % · más o menos ${pc(o.mas)} % · no ${pc(o.no)} %</small>`:`<small class="muted">Aún sin respuestas en “¿Lo sabías?”</small>`}</div>`;}).join("")}</div>`
    :`<div class="empty"><b>Aún no hay datos</b>Consulta fichas y responde “¿Lo sabías?” al final. Aquí verás en qué temas dependes más de la app.</div>`}</section>
   ${weak.length?sec("Para estudiar (respondiste “no” o “más o menos”)",rows(weak.slice(0,8))):""}
   ${top.length?sec("Lo que más consultas",`<ul class="rows">${top.map(d=>`<li><a href="#${d.id}"><span class="t"><b>${esc(d.name)}</b><small>${LRN[d.id].n} consulta${LRN[d.id].n>1?"s":""}${LRN[d.id].lastKnow?` · última respuesta: ${{si:"lo sabía",mas:"más o menos",no:"no lo sabía"}[LRN[d.id].lastKnow]}`:""}</small></span>${ic("right","sm")}</a></li>`).join("")}</ul>`):""}
   <p class="muted" style="font-size:.88rem">Estos datos se guardan solo en este dispositivo. <button class="linkbtn" id="clrL">Borrar mis datos de aprendizaje</button></p></div>`;
  $$("[data-mode]").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
  $("#clrL").onclick=()=>{if(confirm("¿Borrar tu historial de repaso y el mapa de dependencia?")){LRN={};saveL();toast("Datos de aprendizaje borrados");renderLearn();}};}
function learnHomeHTML(){const due=dueList().length;
  return sec("Tu aprendizaje",`<ul class="rows">
   ${due?`<li><a href="#repaso">${ic("clock")}<span class="t"><b>Repaso: ${due} ficha${due>1?"s":""} de tus turnos</b><small>3 preguntas rápidas para que no dependas de la app</small></span>${ic("right","sm")}</a></li>`:""}
      <li><a href="#aprendizaje">${ic("target")}<span class="t"><b>Mi mapa de dependencia</b><small>En qué temas dependes más de Tinterno</small></span>${ic("right","sm")}</a></li></ul>`);}

/* ---------- selector de modo (segmentado) ---------- */
function modeSwitchHTML(){return `<div class="mswitch" role="radiogroup" aria-label="Modo de uso">
  <button role="radio" aria-checked="${MODE!=="estudio"}" data-mode="turno">${ic("zap","sm")}<span>Búsqueda rápida</span></button>
  <button role="radio" aria-checked="${MODE==="estudio"}" data-mode="estudio">${ic("book","sm")}<span>Estudio</span></button></div>`;}
function bindModeSwitch(root){(root||document).querySelectorAll(".mswitch [data-mode]").forEach(b=>b.onclick=()=>{if((b.dataset.mode==="estudio")!==(MODE==="estudio"))setMode(b.dataset.mode);});}

/* ---------- portada ---------- */
const CRIT=["reanimacion","sepsis","shock","pcr-fv","iamcest-icp","acvi","ee","anafilaxia","cad","hiperk","ica","hpp","sri","intox"];
const FREQ=["c-glasgow","c-cha2ds2","c-wellstep","c-curb65","c-crcl","c-news2","c-infusion","c-qtc"];
const REFS=["r-hemograma","r-electrolitos","r-gases","r-renal","r-lcr","r-niveles"];
function sec(t,body,link){return body?`<section class="hsec"><div class="hsec-h"><h2>${t}</h2>${link||""}</div>${body}</section>`:"";}
function renderHome(){const rec=REC.map(byId).filter(Boolean).slice(0,5),fav=FAV.map(byId).filter(Boolean).slice(0,6);
  $("#main").innerHTML=`<div class="page hero"><h1>${MODE==="estudio"?"¿Qué quieres aprender hoy?":"¿Qué necesitas durante el turno?"}</h1>
   ${modeSwitchHTML()}
   <div class="bigsearch" role="search">${ic("search")}<label class="vh" for="hq">Buscar</label><input id="hq" type="search" autocomplete="off" placeholder="Diagnóstico, fármaco, escala…"></div>
   ${MODE==="estudio"?learnHomeHTML():""}
   <nav class="ctx" aria-label="Contextos clínicos">${CTX.map(c=>`<a href="#ctx/${c.k}">${ic(c.i)}<span>${c.n}<small>${inCtx(c.k).length} fichas</small></span></a>`).join("")}</nav>
   ${sec("Consultados recientemente",rows(rec),rec.length?`<button id="clrRec">Borrar</button>`:"")}
   ${sec("Favoritos",rows(fav),fav.length?`<a href="#favoritos">Ver todos</a>`:"")}
   ${MODE==="estudio"?"":learnHomeHTML()}
   ${sec("Urgencias críticas",rows(CRIT.map(byId).filter(Boolean)))}
   ${sec("Calculadoras frecuentes",rows(FREQ.map(byId).filter(Boolean)),`<a href="#ctx/calc">Ver las ${inCtx("calc").length}</a>`)}
   ${sec("Prescripción por peso",`<ul class="rows"><li><a href="#ctx/peso">${ic("scale")}<span class="t"><b>${inCtx("peso").length} fichas con dosis por kilo</b><small>${KG>0?"Calculando con "+fmt(KG)+" kg":"Ingresa el peso una vez y se calculan solas"}</small></span>${ic("right","sm")}</a></li></ul>`)}
   ${sec("Valores de referencia",rows(REFS.map(byId).filter(Boolean)),`<a href="#ctx/ref">Ver las ${inCtx("ref").length}</a>`)}
   ${sec("Explorar por sistemas",`<ul class="rows sysgrid">${MAC.map(m=>`<li><a href="#cat/${m.k}"><span class="t"><b>${m.n}</b></span><span class="muted">${inMac(m.k).length}</span>${ic("right","sm")}</a></li>`).join("")}</ul>`)}
   <details class="about"><summary>${ic("info")} Cómo funciona Tinterno</summary>${aboutText()}</details></div>`;
  const hq=$("#hq");hq.addEventListener("input",()=>{SQ=hq.value;goSearch(true);});bindModeSwitch($("#main"));
  const c=$("#clrRec");if(c)c.onclick=clearRecent;}
function aboutText(){return `<p>Tinterno reúne ${DX.length} fichas: planes de prescripción por diagnóstico, escalas, calculadoras y valores de referencia para urgencias, hospitalización y consulta en Colombia.</p>
  <p>Cada ficha dice primero qué guía colombiana aplica y si está vigente, y con qué guía internacional se complementa. Las órdenes traen dosis, vía, frecuencia, dilución y una alternativa por si el fármaco no está disponible. Si ingresas el peso del paciente, las dosis por kilo y las velocidades de infusión se calculan solas.</p>
  <p>Todo se calcula en tu dispositivo. El peso se borra al cerrar la app; favoritos y recientes se guardan solo en este teléfono o computador.</p>
  <p><b>Tinterno es apoyo a la decisión clínica y no reemplaza el juicio médico.</b> Antes de ordenar verifica dosis, la dilución que usa tu servicio, función renal y hepática, alergias, embarazo, interacciones y disponibilidad institucional. Versión ${VERSION} · revisión de guías: ${REV_LONG}.</p>`;}
/* ---------- búsqueda ---------- */
let SQ="";
function goSearch(fromTyping){if(location.hash!=="#buscar"){location.hash="buscar";}else if(fromTyping)updateResults();}
function renderSearch(){$("#main").innerHTML=`<div class="page"><h1 class="only-mob">Buscar</h1>
   <div class="bigsearch only-mob" role="search">${ic("search")}<label class="vh" for="sq">Buscar</label><input id="sq" type="search" autocomplete="off" placeholder="Diagnóstico, medicamento, escala o sigla…" value="${esc(SQ)}"><button class="clr" id="sqClr" aria-label="Limpiar búsqueda">${ic("x")}</button></div>
   <div id="sres" aria-live="polite"></div></div>`;
  const sq=$("#sq");sq.addEventListener("input",()=>{SQ=sq.value;syncQ();updateResults();});sq.addEventListener("keydown",e=>{if(e.key==="Enter"){const r=searchDX(SQ);if(r.length){sq.blur();location.hash=r[0].d.id;}}});$("#sqClr").onclick=()=>{SQ="";sq.value="";syncQ();updateResults();sq.focus();};
  updateResults();
  const hdr=$("#q");if(hdr&&hdr.offsetParent){hdr.focus();const l=hdr.value.length;hdr.setSelectionRange(l,l);}else{sq.focus();const l=sq.value.length;sq.setSelectionRange(l,l);}}
function syncQ(){const a=$("#q");if(a&&a.value!==SQ)a.value=SQ;const b=$("#sq");if(b&&b.value!==SQ)b.value=SQ;$$(".clr[data-for]").forEach(c=>c.classList.toggle("on",!!SQ));const c2=$("#sqClr");if(c2)c2.classList.toggle("on",!!SQ);}
let __st;function updateResults(){clearTimeout(__st);__st=setTimeout(_upd,90);}
function _upd(){const box=$("#sres");if(!box)return;const q=SQ.trim();
  if(!q){const rec=REC.map(byId).filter(Boolean).slice(0,6),fav=FAV.map(byId).filter(Boolean).slice(0,6);
    box.innerHTML=(rec.length?sec("Recientes",rows(rec)):"")+(fav.length?sec("Favoritos",rows(fav)):"")+sec("Sugerencias",rows(CRIT.slice(0,6).map(byId).filter(Boolean)))
      +`<p class="muted" style="font-size:.9rem">Busca por diagnóstico, sigla (FA, IAM, TEP), medicamento (enoxaparina), escala (Glasgow) o analito (ferritina).</p>`;return;}
  const res=searchDX(q);const ex=res.filter(r=>!r.f).map(r=>r.d),ap=res.filter(r=>r.f).map(r=>r.d);
  if(!res.length){box.innerHTML=`<div class="empty"><b>Sin resultados para “${esc(q)}”</b>Prueba con una sigla, un medicamento o un síntoma. También puedes <a href="#" id="exLink">explorar por sistemas</a>.</div>`;const l=$("#exLink");if(l)l.onclick=e=>{e.preventDefault();isDesk()?(location.hash=""):openExplore();};return;}
  box.innerHTML=`<p class="rcount">${res.length} resultado${res.length>1?"s":""}</p>${rows(ex,q)}${ap.length?`<h2 class="rcount" style="margin-top:24px">Coincidencias aproximadas</h2>${rows(ap)}`:""}`;}
const isDesk=()=>matchMedia("(min-width:1024px)").matches;
/* ---------- listados por sistema y contexto ---------- */
function listPage(title,crumb,lead,groups,openAll){const body=groups.map(([t,arr],i)=>`<details class="hsec lz" ${openAll||groups.length===1||i===0?"open":""} data-i="${i}"><summary class="hsec-h" style="cursor:pointer;min-height:44px;align-items:center"><h2>${esc(t)}</h2><span class="muted">${arr.length}</span></summary><div class="lzb">${openAll||groups.length===1||i===0?rows(arr):""}</div></details>`).join("");
  $("#main").innerHTML=`<div class="page">${crumb}<h1>${esc(title)}</h1>${lead?`<p class="lead">${lead}</p>`:""}${body||`<p class="empty">Sin fichas.</p>`}</div>`;
  $$("details.lz").forEach(dt=>dt.addEventListener("toggle",()=>{const b=dt.querySelector(".lzb");if(dt.open&&!b.innerHTML)b.innerHTML=rows(groups[+dt.dataset.i][1]);}));}
function renderCat(m,sub){const M=MAC.find(x=>x.k===m);if(!M){renderNotFound();return;}SB_OPEN=m;
  const subs=subsOf(m).filter(([s])=>!sub||s===sub);
  listPage(sub||M.n,`<nav class="crumb" aria-label="Ruta"><a href="#">Inicio</a>${ic("right","sm")}${sub?`<a href="#cat/${m}">${M.n}</a>`:"<span>Sistemas</span>"}</nav>`,sub?"":`${inMac(m).length} fichas en ${subsOf(m).length} secciones.`,
    subs.map(([s])=>[s,inMac(m).filter(d=>TAX[d.id].sub===s)]),!!sub);}
function renderCtx(k){const list=inCtx(k);if(!list.length&&k!=="peso"){renderNotFound();return;}const C=CTX.find(c=>c.k===k);
  let groups;if(k==="calc"||k==="ref"){const g={};list.forEach(d=>{(g[d.group]=g[d.group]||[]).push(d);});groups=Object.entries(g);}
  else{groups=MAC.map(m=>[m.n,list.filter(d=>TAX[d.id].mac===m.k)]).filter(x=>x[1].length);}
  listPage(ctxName(k),`<nav class="crumb" aria-label="Ruta"><a href="#">Inicio</a>${ic("right","sm")}<span>Contextos</span></nav>`,k==="peso"?"Fichas con dosis que se calculan con el peso del paciente.":(C?C.d+". ":"")+list.length+" fichas.",groups,k==="calc"||k==="ref");}
function renderFavs(){const fav=FAV.map(byId).filter(Boolean),rec=REC.map(byId).filter(Boolean);
  $("#main").innerHTML=`<div class="page"><h1>Favoritos y recientes</h1>
   ${fav.length?sec("Favoritos",rows(fav)):`<div class="empty"><b>Aún no tienes favoritos</b>Toca la estrella en cualquier ficha para guardarla aquí. Se guardan solo en este dispositivo.</div>`}
   ${rec.length?sec("Recientes",rows(rec),`<button id="clrRec2">Borrar historial</button>`):""}</div>`;const c=$("#clrRec2");if(c)c.onclick=clearRecent;}
function renderAbout(){$("#main").innerHTML=`<div class="page"><h1>Cómo funciona Tinterno</h1>${aboutText()}<p><a href="#">Volver al inicio</a></p></div>`;}
function renderNotFound(){$("#main").innerHTML=`<div class="page empty"><b>No encontramos esa página</b><a href="#">Volver al inicio</a></div>`;}
/* ---------- router ---------- */
function route(){closeLayer(true);const h=decodeURIComponent(location.hash.slice(1));current=null;let title="Tinterno · Guía clínica para el turno";
  if(!h)renderHome();else if(h==="buscar")renderSearch();else if(h==="favoritos")renderFavs();else if(h==="acerca")renderAbout();
  else if(h==="repaso"){renderRepaso();title="Repaso · Tinterno";}else if(h==="aprendizaje"){renderLearn();title="Mi aprendizaje · Tinterno";}
  else if(h.startsWith("cat/")){const [,m,...rest]=h.split("/");renderCat(m,rest.length?rest.join("/"):null);title=macName(m)+" · Tinterno";}
  else if(h.startsWith("ctx/")){renderCtx(h.slice(4));title=ctxName(h.slice(4))+" · Tinterno";}
  else{const d=byId(h);if(d){current=d.id;pushRecent(d.id);logView(d);if(TAX[d.id].mac)SB_OPEN=TAX[d.id].mac;d.calcForm?renderCalcView(d):d.rows?renderRefView(d):renderFicha(d);title=d.name+" · Tinterno";}else renderNotFound();}
  document.title=title;document.body.classList.toggle("in-ficha",!!current);renderSidebar();renderBnav();window.scrollTo(0,0);
  if(h&&h!=="buscar"&&window.__routed){const m=$("#main");m.focus({preventScroll:true});}window.__routed=true;}
/* ---------- arranque ---------- */
function init(){$("#logoSlot").innerHTML=LOGO;applyTheme();updatePt();
  $("#themeBtn").onclick=cycleTheme;$("#ptBtn").onclick=openPatient;$("#menuBtn").onclick=openMenu;$("#favBtn").onclick=()=>{location.hash="favoritos";};
  $("#sbToggle").onclick=()=>{const off=document.body.classList.toggle("sb-off");LS.set("tinterno-sb",off?"off":"on");$("#sbToggle").setAttribute("aria-expanded",!off);};
  if(LS.get("tinterno-sb","on")==="off"){document.body.classList.add("sb-off");$("#sbToggle").setAttribute("aria-expanded","false");}
  const q=$("#q");q.addEventListener("input",()=>{SQ=q.value;syncQ();goSearch(true);});
  q.addEventListener("keydown",e=>{if(e.key==="Enter"){const r=searchDX(SQ);if(r.length)location.hash=r[0].d.id;}if(e.key==="Escape"){SQ="";q.value="";syncQ();q.blur();}});
  $("#qClr").onclick=()=>{SQ="";q.value="";syncQ();updateResults();q.focus();};
  $("#sidebar").addEventListener("click",e=>{const b=e.target.closest("[data-mac]");if(b){SB_OPEN=SB_OPEN===b.dataset.mac?"":b.dataset.mac;renderSidebar();const nb=$(`[data-mac="${b.dataset.mac}"]`);if(nb)nb.focus();}});
  $("#scrim").onclick=()=>closeLayer();$$("[data-close]").forEach(b=>b.onclick=()=>closeLayer());
  $("#exq").addEventListener("input",e=>renderExplore(e.target.value));
  $("#sheet").addEventListener("click",e=>{if(e.target.closest("a[href]"))closeLayer(true);});
  enableSwipe($("#sheet"));
  window.addEventListener("hashchange",route);window.addEventListener("beforeprint",()=>$$("details.evd").forEach(x=>x.open=true));
  route();}
init();

if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});}
</script>
</body>
</html>
